[workspace]
resolver = "3"
members = [
    "crates/engine-core",
    "crates/engine-docker",
    "crates/compose",
    "crates/dockinng-cli",
    "app",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v7"] }
futures-util = "0.3"
futures-core = "0.3"
async-trait = "0.1"
libc = "0.2"
base64 = "0.22"
shlex = "2"
