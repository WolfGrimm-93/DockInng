[workspace]
resolver = "3"
members = [
    "crates/engine-core",
    "crates/engine-docker",
    "crates/compose",
    "crates/dockinng-cli",
    "crates/store",
    "crates/transport",
    "crates/builder",
    "app",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
authors = ["wolfgrimm <mferrer_inf@hotmail.com>"]
description = "Docker manager for Linux (desktop GUI + CLI)"
repository = "https://github.com/WolfGrimm-93/DockInng"
homepage = "https://github.com/WolfGrimm-93/DockInng"
keywords = ["docker", "containers", "compose", "desktop", "tauri"]
categories = ["development-tools"]

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v7"] }
futures-util = "0.3"
futures-core = "0.3"
async-trait = "0.1"
libc = "0.2"
base64 = "0.22"
shlex = "2"
rusqlite = { version = "0.37", features = ["bundled"] }
# Llavero: features de plataforma EXPLÍCITAS (sin ellas keyring usa un almacén mock en silencio).
keyring = { version = "3", default-features = false, features = ["async-secret-service", "tokio", "crypto-rust"] }
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
zeroize = "1"
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring", "pem"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
bollard = { version = "0.21", features = ["ssl"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
# Sin panic="abort": streams.rs usa catch_unwind.
