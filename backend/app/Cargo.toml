[package]
name = "dockinng-app"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "Shell de escritorio (Tauri) de DockInng: expone el núcleo a la interfaz por IPC"
repository.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "dockinng_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
engine-core = { path = "../crates/engine-core" }
engine-docker = { path = "../crates/engine-docker" }
compose = { path = "../crates/compose" }
store = { path = "../crates/store" }
transport = { path = "../crates/transport" }
builder = { path = "../crates/builder" }
base64.workspace = true
tauri = { version = "2", features = ["tray-icon", "image-png"] }
notify-rust = "4.18"
tauri-runtime = "2"
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["process"] }
futures-util.workspace = true
uuid.workspace = true
tauri-plugin-dialog = "^2.4.0"

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
engine-core = { path = "../crates/engine-core", features = ["testing"] }
tokio = { workspace = true, features = ["test-util"] }
